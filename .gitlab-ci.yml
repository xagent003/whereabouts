---
stages:
  - pre-build
  - img-release

dummy-ci:
  stage: pre-build
  tags:
    - shell
  script:
    - echo "No CI scheduled for feature branches"
  rules:
    - if: $CI_COMMIT_BRANCH != "main" && $CI_PIPELINE_SOURCE != 'merge_request_event'

release-img-upon-tag:
  tags:
    - shell
  stage: img-release
  variables:
    REGISTRY_IMAGE: "$CI_REGISTRY_IMAGE:$CI_COMMIT_TAG"
  before_script:
    - echo "Logging in to GitLab Container Registry..."
    - docker login -u "$CI_REGISTRY_USER" --password $CI_JOB_TOKEN $CI_REGISTRY
  script:
    - echo "Building the Docker image $REGISTRY_IMAGE"
    - docker build -t $REGISTRY_IMAGE .
    - echo "Pushing the Docker image $REGISTRY_IMAGE to GitLab Container Registry..."
    - docker push $REGISTRY_IMAGE
  rules:
    - if: $CI_COMMIT_TAG

